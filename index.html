<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">

<title>🖤 Desculpa, meu anjo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

html {
    color-scheme: only light !important;
}

body {
    background-color: #6b1a2a;
    background-image: radial-gradient(rgba(0, 0, 0, 0.35) 1px, transparent 1px);
    background-size: 18px 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    -webkit-color-scheme: only light;
    forced-color-adjust: none;
}

*, *::before, *::after {
    -webkit-color-scheme: only light;
    forced-color-adjust: none;
}

/* =====================================================
   LAYOUT PRINCIPAL
===================================================== */

.layout-principal {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 100%;
    padding: 20px 60px;
    z-index: 5;
    gap: 60px;
}

/* =====================================================
   FOTOS
===================================================== */

.foto-container {
    flex: 0 0 auto;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    transition: all 0.4s ease;
    cursor: pointer;
}

.foto-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
}

.foto-esquerda2 {
    width: 180px;
    height: 250px;
    transform: rotate(-6deg);
    box-shadow: 
        0 0 18px rgba(255, 23, 68, 0.5),
        0 0 35px rgba(255, 23, 68, 0.3),
        0 8px 25px rgba(0, 0, 0, 0.5);
    border: 3px solid rgba(255, 59, 92, 0.7);
    animation: flutuarEsq2 5s ease-in-out infinite;
}

@keyframes flutuarEsq2 {
    0%, 100% { transform: rotate(-6deg) translateY(0); }
    50% { transform: rotate(-6deg) translateY(-6px); }
}

.foto-esquerda {
    width: 200px;
    height: 280px;
    transform: rotate(-3deg);
    box-shadow: 
        0 0 20px rgba(255, 23, 68, 0.5),
        0 0 40px rgba(255, 23, 68, 0.3),
        0 8px 30px rgba(0, 0, 0, 0.5);
    border: 3px solid rgba(255, 59, 92, 0.7);
    animation: flutuarEsq1 5s ease-in-out infinite;
    animation-delay: 0.5s;
}

@keyframes flutuarEsq1 {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50% { transform: rotate(-3deg) translateY(-8px); }
}

.foto-direita {
    width: 200px;
    height: 280px;
    transform: rotate(3deg);
    box-shadow: 
        0 0 20px rgba(255, 23, 68, 0.5),
        0 0 40px rgba(255, 23, 68, 0.3),
        0 8px 30px rgba(0, 0, 0, 0.5);
    border: 3px solid rgba(255, 59, 92, 0.7);
    animation: flutuarDir1 5s ease-in-out infinite;
    animation-delay: 1s;
}

@keyframes flutuarDir1 {
    0%, 100% { transform: rotate(3deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-8px); }
}

.foto-direita2 {
    width: 180px;
    height: 250px;
    transform: rotate(6deg);
    box-shadow: 
        0 0 18px rgba(255, 23, 68, 0.5),
        0 0 35px rgba(255, 23, 68, 0.3),
        0 8px 25px rgba(0, 0, 0, 0.5);
    border: 3px solid rgba(255, 59, 92, 0.7);
    animation: flutuarDir2 5s ease-in-out infinite;
    animation-delay: 1.5s;
}

@keyframes flutuarDir2 {
    0%, 100% { transform: rotate(6deg) translateY(0); }
    50% { transform: rotate(6deg) translateY(-6px); }
}

.foto-container:hover {
    box-shadow: 
        0 0 30px rgba(255, 23, 68, 0.9),
        0 0 60px rgba(255, 23, 68, 0.6),
        0 8px 30px rgba(0, 0, 0, 0.5);
    z-index: 20;
}

/* =====================================================
   CONTAINER DO SÍMBOLO
===================================================== */

.simbolo-container {
    position: relative;
    width: min(45vw, 45vh, 380px);
    height: min(45vw, 45vh, 380px);
    z-index: 5;
    flex: 0 0 auto;
    touch-action: none;
}

.linhas-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    overflow: visible;
}

.linha-preview {
    stroke: #ff8fa3;
    stroke-width: 2;
    stroke-dasharray: 5 5;
    fill: none;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.1s ease;
}

.linha-preview.ativa {
    opacity: 0.8;
}

.linha {
    stroke: #ff3b5c;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    filter: drop-shadow(0 0 5px rgba(255, 0, 34, 0.8));
    opacity: 0;
    transition: opacity 0.3s ease;
}

.linha.ativa {
    opacity: 1;
    animation: pulsarLinha 2s ease-in-out infinite;
}

@keyframes pulsarLinha {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
}

/* =====================================================
   CORAÇÕES
===================================================== */

.coracao {
    position: absolute;
    width: 20%;
    height: 20%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.coracao svg {
    width: 100%;
    height: 100%;
    animation: pulsarCoracao 2s ease-in-out infinite;
    transition: filter 0.3s ease;
    forced-color-adjust: none;
}

.coracao.vermelho svg {
    filter: 
        drop-shadow(0 0 8px #ff1744) 
        drop-shadow(0 0 16px #ff1744) 
        drop-shadow(0 0 24px rgba(255, 23, 68, 0.6));
}

.coracao.azul svg {
    filter: 
        drop-shadow(0 0 8px #2196f3) 
        drop-shadow(0 0 16px #2196f3) 
        drop-shadow(0 0 24px rgba(33, 150, 243, 0.6));
}

.coracao.preto svg {
    filter: 
        drop-shadow(0 0 8px #bbbbbb) 
        drop-shadow(0 0 16px #888888) 
        drop-shadow(0 0 24px rgba(187, 187, 187, 0.5));
}

.coracao:hover svg {
    filter: brightness(1.4) !important;
}

.coracao.ativo svg {
    filter: brightness(1.6) !important;
    transform: scale(1.15);
}

.coracao.errado svg {
    animation: tremerCoracao 0.4s ease;
}

@keyframes tremerCoracao {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}

@keyframes pulsarCoracao {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

/* =====================================================
   POSIÇÕES DOS 7 CORAÇÕES
===================================================== */

.c1 { top: 0%; left: 50%; transform: translate(-50%, 0); }
.c2 { top: 20%; left: 12%; }
.c3 { top: 20%; right: 12%; }
.c4 { top: 50%; left: 50%; transform: translate(-50%, -50%); }
.c5 { bottom: 20%; left: 12%; }
.c6 { bottom: 20%; right: 12%; }
.c7 { bottom: 0%; left: 50%; transform: translate(-50%, 0); }

/* =====================================================
   TÍTULO E RODAPÉ
===================================================== */

.titulo {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffccd5;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(255, 0, 34, 0.5);
    z-index: 50;
    text-align: center;
    white-space: nowrap;
}

.rodape {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 204, 213, 0.7);
    font-size: 13px;
    letter-spacing: 3px;
    z-index: 50;
    text-align: center;
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
}

/* ✅ SÍMBOLO 𒉭 APÓS O TEXTO */
.rodape .simbolo {
    font-size: 20px;
    color: #ff3b5c;
    text-shadow: 
        0 0 10px rgba(255, 23, 68, 0.9),
        0 0 20px rgba(255, 23, 68, 0.6),
        0 0 30px rgba(255, 23, 68, 0.4);
    animation: pulsarSimbolo 2s ease-in-out infinite;
    display: inline-block;
    line-height: 1;
    vertical-align: middle;
}

@keyframes pulsarSimbolo {
    0%, 100% { 
        transform: scale(1);
        filter: brightness(1);
    }
    50% { 
        transform: scale(1.15);
        filter: brightness(1.3);
    }
}

/* =====================================================
   ZOOM DA FOTO
===================================================== */

.zoom-foto {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(15px);
    z-index: 5000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 40px;
    cursor: zoom-out;
    animation: fadeIn 0.4s ease;
}

.zoom-foto.ativo {
    display: flex;
}

.zoom-foto img {
    max-width: 90vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    border-radius: 20px;
    border: 3px solid rgba(255, 59, 92, 0.8);
    box-shadow: 
        0 0 40px rgba(255, 23, 68, 0.8),
        0 0 80px rgba(255, 23, 68, 0.5),
        0 0 120px rgba(255, 23, 68, 0.3);
    animation: zoomIn 0.4s ease;
}

@keyframes zoomIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.zoom-foto .fechar-zoom {
    position: fixed;
    top: 20px;
    right: 30px;
    color: #ff3b5c;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    text-shadow: 0 0 20px rgba(255, 23, 68, 0.8);
    z-index: 5001;
    line-height: 1;
}

.zoom-foto .fechar-zoom:hover {
    transform: scale(1.2) rotate(90deg);
    color: white;
}

/* =====================================================
   MODAL DE MENSAGEM
===================================================== */

.modal-mensagem {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(12px);
    z-index: 2000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    animation: fadeIn 0.8s ease;
}

.modal-mensagem.ativo {
    display: flex;
}

.modal-mensagem-box {
    background: linear-gradient(145deg, rgba(60, 10, 20, 0.97), rgba(20, 2, 6, 0.97));
    border: 2px solid rgba(255, 23, 68, 0.6);
    border-radius: 30px;
    padding: 50px 55px;
    max-width: 620px;
    width: 92%;
    max-height: 85vh;
    overflow-y: auto;
    text-align: left;
    box-shadow:
        0 0 60px rgba(255, 23, 68, 0.2),
        0 0 120px rgba(255, 23, 68, 0.08),
        inset 0 0 60px rgba(255, 23, 68, 0.04);
    animation: scaleIn 0.8s ease;
}

.modal-mensagem-box::-webkit-scrollbar {
    width: 6px;
}

.modal-mensagem-box::-webkit-scrollbar-thumb {
    background: rgba(255, 23, 68, 0.5);
    border-radius: 10px;
}

.modal-mensagem-heart {
    font-size: 55px;
    display: block;
    margin-bottom: 18px;
    text-align: center;
    animation: pulsarCoracao 1.5s ease-in-out infinite;
}

.modal-mensagem-box .mensagem-texto {
    color: #e8d5d8;
    font-size: 18px;
    line-height: 2;
    font-weight: 300;
    letter-spacing: 0.3px;
}

.modal-mensagem-box .mensagem-texto .destaque {
    color: #ff3b5c;
    font-weight: 500;
}

.modal-mensagem-btn {
    background: linear-gradient(135deg, #ff1744, #a50022);
    border: none;
    color: white;
    font-size: 17px;
    font-weight: 600;
    padding: 14px 45px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 3px;
    box-shadow: 0 0 30px rgba(255, 23, 68, 0.4);
    display: block;
    margin: 30px auto 0;
}

.modal-mensagem-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 50px rgba(255, 23, 68, 0.7);
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes scaleIn {
    from { transform: scale(0.85) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width: 1400px) {
    .layout-principal {
        gap: 40px;
        padding: 20px 30px;
    }
}

@media(max-width: 1200px) {
    .layout-principal {
        gap: 30px;
        padding: 15px 20px;
    }

    .foto-esquerda2,
    .foto-direita2 {
        width: 140px;
        height: 200px;
    }

    .foto-esquerda,
    .foto-direita {
        width: 160px;
        height: 230px;
    }

    .simbolo-container {
        width: min(40vw, 40vh, 320px);
        height: min(40vw, 40vh, 320px);
    }
}

@media(max-width: 900px) {
    .layout-principal {
        gap: 20px;
        padding: 15px 10px;
    }

    .foto-esquerda2,
    .foto-direita2 {
        width: 90px;
        height: 140px;
    }

    .foto-esquerda,
    .foto-direita {
        width: 110px;
        height: 160px;
    }

    .simbolo-container {
        width: min(35vw, 35vh, 260px);
        height: min(35vw, 35vh, 260px);
    }

    .titulo {
        font-size: 16px;
        letter-spacing: 4px;
    }

    .rodape {
        font-size: 10px;
    }

    .rodape .simbolo {
        font-size: 16px;
    }
}

@media(max-width: 600px) {
    .layout-principal {
        flex-wrap: wrap;
        gap: 15px;
        justify-content: center;
        padding: 15px 10px;
    }

    .foto-esquerda2,
    .foto-direita2 {
        width: 80px;
        height: 120px;
    }

    .foto-esquerda,
    .foto-direita {
        width: 100px;
        height: 145px;
    }

    .simbolo-container {
        width: min(75vw, 300px);
        height: min(75vw, 300px);
        order: -1;
        flex-basis: 100%;
        margin-bottom: 10px;
    }

    .coracao svg {
        forced-color-adjust: none !important;
        -webkit-forced-color-adjust: none !important;
    }

    .coracao.vermelho svg {
        filter: 
            drop-shadow(0 0 6px #ff1744) 
            drop-shadow(0 0 12px #ff1744) 
            drop-shadow(0 0 20px rgba(255, 23, 68, 0.8)) !important;
    }

    .coracao.azul svg {
        filter: 
            drop-shadow(0 0 6px #2196f3) 
            drop-shadow(0 0 12px #2196f3) 
            drop-shadow(0 0 20px rgba(33, 150, 243, 0.8)) !important;
    }

    .coracao.preto svg {
        filter: 
            drop-shadow(0 0 6px #cccccc) 
            drop-shadow(0 0 12px #888888) 
            drop-shadow(0 0 20px rgba(200, 200, 200, 0.7)) !important;
    }

    .titulo {
        font-size: 13px;
        letter-spacing: 2px;
        top: 12px;
    }

    .rodape {
        font-size: 9px;
        bottom: 12px;
        gap: 6px;
    }

    .rodape .simbolo {
        font-size: 14px;
    }

    .modal-mensagem-box {
        padding: 30px 22px;
    }

    .modal-mensagem-box .mensagem-texto {
        font-size: 15px;
        line-height: 1.8;
    }

    .zoom-foto {
        padding: 15px;
    }

    .zoom-foto .fechar-zoom {
        font-size: 32px;
        top: 15px;
        right: 20px;
    }
}
</style>
</head>
