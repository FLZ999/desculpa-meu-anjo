<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖤 Desculpa, meu anjo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background-color: #6b1a2a;
    background-image: radial-gradient(rgba(0, 0, 0, 0.35) 1px, transparent 1px);
    background-size: 18px 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
}

/* =====================================================
   LAYOUT PRINCIPAL (FOTO + SÍMBOLO + FOTO)
===================================================== */

.layout-principal {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    width: 100%;
    max-width: 1200px;
    padding: 40px;
    z-index: 5;
}

/* =====================================================
   FOTOS
===================================================== */

.foto-container {
    flex: 0 0 auto;
    width: 200px;
    height: 280px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    transition: all 0.4s ease;
}

.foto-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Foto esquerda */
.foto-esquerda {
    transform: rotate(-3deg);
    box-shadow: 
        0 0 20px rgba(255, 23, 68, 0.5),
        0 0 40px rgba(255, 23, 68, 0.3),
        0 8px 30px rgba(0, 0, 0, 0.5);
    border: 3px solid rgba(255, 59, 92, 0.7);
    animation: flutuarFoto 5s ease-in-out infinite;
}

/* Foto direita */
.foto-direita {
    transform: rotate(3deg);
    box-shadow: 
        0 0 20px rgba(255, 23, 68, 0.5),
        0 0 40px rgba(255, 23, 68, 0.3),
        0 8px 30px rgba(0, 0, 0, 0.5);
    border: 3px solid rgba(255, 59, 92, 0.7);
    animation: flutuarFoto 5s ease-in-out infinite reverse;
}

@keyframes flutuarFoto {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50% { transform: rotate(-3deg) translateY(-8px); }
}

.foto-direita {
    animation: flutuarFotoDireita 5s ease-in-out infinite;
}

@keyframes flutuarFotoDireita {
    0%, 100% { transform: rotate(3deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-8px); }
}

/* Hover nas fotos */
.foto-container:hover {
    transform: scale(1.05);
    box-shadow: 
        0 0 30px rgba(255, 23, 68, 0.8),
        0 0 60px rgba(255, 23, 68, 0.5),
        0 8px 30px rgba(0, 0, 0, 0.5);
}

.foto-esquerda:hover {
    transform: rotate(-3deg) scale(1.05);
}

.foto-direita:hover {
    transform: rotate(3deg) scale(1.05);
}

/* =====================================================
   CONTAINER DO SÍMBOLO
===================================================== */

.simbolo-container {
    position: relative;
    width: min(80vw, 80vh, 500px);
    height: min(80vw, 80vh, 500px);
    z-index: 5;
    flex: 0 0 auto;
    touch-action: none;
}

/* SVG de fundo com as linhas */
.linhas-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    overflow: visible;
}

/* Linha de preview */
.linha-preview {
    stroke: #ff8fa3;
    stroke-width: 2;
    stroke-dasharray: 5 5;
    fill: none;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.1s ease;
}

.linha-preview.ativa {
    opacity: 0.8;
}

/* Linhas conectadas */
.linha {
    stroke: #ff3b5c;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    filter: drop-shadow(0 0 5px rgba(255, 0, 34, 0.8));
    opacity: 0;
    transition: opacity 0.3s ease;
}

.linha.ativa {
    opacity: 1;
    animation: pulsarLinha 2s ease-in-out infinite;
}

@keyframes pulsarLinha {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
}

/* =====================================================
   CORAÇÕES
===================================================== */

.coracao {
    position: absolute;
    width: 20%;
    height: 20%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.coracao svg {
    width: 100%;
    height: 100%;
    animation: pulsarCoracao 2.5s ease-in-out infinite;
    transition: filter 0.4s ease, opacity 0.4s ease;
}

.coracao svg {
    opacity: 0.3;
    filter: grayscale(100%) brightness(0.5);
}

.coracao.aceso svg {
    opacity: 1;
    filter: none !important;
}

.coracao.ativo svg {
    opacity: 1;
    filter: brightness(1.3) !important;
    transform: scale(1.1);
}

.coracao.vermelho.aceso svg {
    filter: drop-shadow(0 0 12px rgba(255, 0, 34, 0.9)) !important;
}

.coracao.azul.aceso svg {
    filter: drop-shadow(0 0 14px rgba(80, 150, 255, 1)) !important;
}

.coracao.preto.aceso svg {
    filter: drop-shadow(0 0 10px rgba(100, 100, 100, 0.8)) !important;
}

.coracao.errado svg {
    animation: tremerCoracao 0.4s ease;
}

@keyframes tremerCoracao {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}

@keyframes pulsarCoracao {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

/* =====================================================
   POSIÇÕES DOS 7 CORAÇÕES
===================================================== */

.c1 { top: 0%; left: 50%; transform: translate(-50%, 0); }
.c2 { top: 20%; left: 12%; }
.c3 { top: 20%; right: 12%; }
.c4 { top: 50%; left: 50%; transform: translate(-50%, -50%); }
.c5 { bottom: 20%; left: 12%; }
.c6 { bottom: 20%; right: 12%; }
.c7 { bottom: 0%; left: 50%; transform: translate(-50%, 0); }

/* =====================================================
   TÍTULO E RODAPÉ
===================================================== */

.titulo {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffccd5;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(255, 0, 34, 0.5);
    z-index: 50;
    text-align: center;
    white-space: nowrap;
}

.rodape {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 204, 213, 0.6);
    font-size: 13px;
    letter-spacing: 3px;
    z-index: 50;
    text-align: center;
}

/* =====================================================
   MODAL DE MENSAGEM
===================================================== */

.modal-mensagem {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(12px);
    z-index: 2000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    animation: fadeIn 0.8s ease;
}

.modal-mensagem.ativo {
    display: flex;
}

.modal-mensagem-box {
    background: linear-gradient(145deg, rgba(60, 10, 20, 0.97), rgba(20, 2, 6, 0.97));
    border: 2px solid rgba(255, 23, 68, 0.6);
    border-radius: 30px;
    padding: 50px 55px;
    max-width: 620px;
    width: 92%;
    max-height: 85vh;
    overflow-y: auto;
    text-align: left;
    box-shadow:
        0 0 60px rgba(255, 23, 68, 0.2),
        0 0 120px rgba(255, 23, 68, 0.08),
        inset 0 0 60px rgba(255, 23, 68, 0.04);
    animation: scaleIn 0.8s ease;
}

.modal-mensagem-box::-webkit-scrollbar {
    width: 6px;
}

.modal-mensagem-box::-webkit-scrollbar-thumb {
    background: rgba(255, 23, 68, 0.5);
    border-radius: 10px;
}

.modal-mensagem-heart {
    font-size: 55px;
    display: block;
    margin-bottom: 18px;
    text-align: center;
    animation: pulsarCoracao 1.5s ease-in-out infinite;
}

.modal-mensagem-box .mensagem-texto {
    color: #e8d5d8;
    font-size: 18px;
    line-height: 2;
    font-weight: 300;
    letter-spacing: 0.3px;
}

.modal-mensagem-box .mensagem-texto .destaque {
    color: #ff3b5c;
    font-weight: 500;
}

.modal-mensagem-btn {
    background: linear-gradient(135deg, #ff1744, #a50022);
    border: none;
    color: white;
    font-size: 17px;
    font-weight: 600;
    padding: 14px 45px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 3px;
    box-shadow: 0 0 30px rgba(255, 23, 68, 0.4);
    display: block;
    margin: 30px auto 0;
}

.modal-mensagem-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 50px rgba(255, 23, 68, 0.7);
}

/* =====================================================
   KEYFRAMES
===================================================== */

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes scaleIn {
    from { transform: scale(0.85) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width: 900px) {
    .layout-principal {
        gap: 10px;
        padding: 20px;
    }

    .foto-container {
        width: 130px;
        height: 180px;
    }

    .simbolo-container {
        width: min(60vw, 60vh, 350px);
        height: min(60vw, 60vh, 350px);
    }

    .titulo {
        font-size: 16px;
        letter-spacing: 4px;
    }

    .rodape {

    }
}

@media(max-width: 600px) {

    }

    }

    .rodape {
        font-size: 9px;

    }

        padding: 30px 22px;
    }

    .modal-mensagem-box .mensagem-texto {
        font-size: 15px;
        line-height: 1.8;
    }
}
</style>
</head>

<script>
(function() {
    'use strict';

    const conexoesPermitidas = [
        '1-2', '1-3',
        '2-4', '3-4',
        '4-5', '4-6',
        '5-7', '6-7'
    ];

    const TOTAL_CONEXOES = 8;

    const container = document.getElementById('simboloContainer');
    const coracoes = document.querySelectorAll('.coracao');
    const rodape = document.getElementById('rodape');
    const modalMensagem = document.getElementById('modalMensagem');
    const fecharMensagem = document.getElementById('fecharMensagem');
    const linhaPreview = document.getElementById('linhaPreview');

    let conexoesFeitas = 0;
    let coracaoOrigem = null;
    let arrastando = false;

    function getPosicaoRelativa(e) {
        const rect = container.getBoundingClientRect();
        let clientX, clientY;

        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX;
            clientY = e.changedTouches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        const x = ((clientX - rect.left) / rect.width) * 100;
        const y = ((clientY - rect.top) / rect.height) * 100;

        return { x, y };
    }

    function estaProximo(p1, p2, tolerancia = 10) {
        const dx = Math.abs(p1.x - p2.x);
        const dy = Math.abs(p1.y - p2.y);
        return dx < tolerancia && dy < tolerancia;
    }

    function gerarChave(i1, i2) {
        const menor = Math.min(i1, i2);
        const maior = Math.max(i1, i2);
        return menor + '-' + maior;
    }

    function iniciarArrasto(coracao, e) {
        e.preventDefault();

        coracaoOrigem = coracao;
        arrastando = true;

        coracao.classList.add('ativo');
        coracao.classList.add('aceso');

        const x1 = parseFloat(coracao.dataset.x);
        const y1 = parseFloat(coracao.dataset.y);

        linhaPreview.setAttribute('x1', x1);
        linhaPreview.setAttribute('y1', y1);
        linhaPreview.setAttribute('x2', x1);
        linhaPreview.setAttribute('y2', y1);
        linhaPreview.classList.add('ativa');
    }

    function moverArrasto(e) {
        if (!arrastando || !coracaoOrigem) return;

        e.preventDefault();

        const pos = getPosicaoRelativa(e);
        linhaPreview.setAttribute('x2', pos.x);
        linhaPreview.setAttribute('y2', pos.y);

        coracoes.forEach(function(c) {
            if (c === coracaoOrigem) return;

            const cx = parseFloat(c.dataset.x);
            const cy = parseFloat(c.dataset.y);

            if (estaProximo(pos, { x: cx, y: cy }, 12)) {
                if (!c.classList.contains('aceso')) {
                    c.style.filter = 'brightness(1.4)';
                }
            } else {
                c.style.filter = '';
            }
        });
    }

    function finalizarArrasto(e) {
        if (!arrastando || !coracaoOrigem) return;

        e.preventDefault();

        const pos = getPosicaoRelativa(e);

        let coracaoAlvo = null;
        coracoes.forEach(function(c) {
            c.style.filter = '';
            if (c === coracaoOrigem) return;

            const cx = parseFloat(c.dataset.x);
            const cy = parseFloat(c.dataset.y);

            if (estaProximo(pos, { x: cx, y: cy }, 12)) {
                coracaoAlvo = c;
            }
        });

        if (coracaoAlvo) {
            const idx1 = parseInt(coracaoOrigem.dataset.index);
            const idx2 = parseInt(coracaoAlvo.dataset.index);
            const chave = gerarChave(idx1, idx2);

            if (conexoesPermitidas.includes(chave)) {
                const linha = document.getElementById('linha-' + chave);

                if (linha && !linha.classList.contains('ativa')) {
                    linha.classList.add('ativa');
                    coracaoOrigem.classList.add('aceso');
                    coracaoAlvo.classList.add('aceso');

                    conexoesFeitas++;

                    if (conexoesFeitas >= TOTAL_CONEXOES) {
                        setTimeout(function() {
                            abrirMensagem();
                        }, 700);
                    }
                }
            } else {
                coracaoAlvo.classList.add('errado');
                setTimeout(function() {
                    coracaoAlvo.classList.remove('errado');
                }, 400);
            }
        }

        coracaoOrigem.classList.remove('ativo');
        linhaPreview.classList.remove('ativa');
        coracaoOrigem = null;
        arrastando = false;
    }

    coracoes.forEach(function(coracao) {
        coracao.addEventListener('mousedown', function(e) {
            iniciarArrasto(this, e);
        });

        coracao.addEventListener('touchstart', function(e) {
            iniciarArrasto(this, e);
        }, { passive: false });
    });

    document.addEventListener('mousemove', moverArrasto);
    document.addEventListener('mouseup', finalizarArrasto);
    document.addEventListener('touchmove', moverArrasto, { passive: false });
    document.addEventListener('touchend', finalizarArrasto, { passive: false });

    function abrirMensagem() {
        modalMensagem.style.display = 'flex';
        void modalMensagem.offsetWidth;
        modalMensagem.classList.add('ativo');
        rodape.textContent = '✨ você conseguiu! ✨';
    }

    function fecharModal() {
        modalMensagem.style.animation = 'fadeIn 0.3s ease reverse';
        setTimeout(function() {
            modalMensagem.classList.remove('ativo');
            modalMensagem.style.display = 'none';
        }, 300);
    }

    fecharMensagem.addEventListener('click', fecharModal);

    modalMensagem.addEventListener('click', function(e) {
        if (e.target === modalMensagem) {
            fecharModal();
        }
    });

    console.log('🖤 Desculpa, meu anjo!');
    console.log('🔗 Arraste de um coração até outro para conectar!');

})();
</script>
